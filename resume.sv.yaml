work:
  - name: iCore Solutions AB
    location: Göteborg
    # description:
    position: Systemutvecklare
    # url:
    startDate: 2017-08-01
    # endDate:
    summary: >
      Jag arbetar som systemutvecklare och har under min tid här jobbat i många team och konstellationer.
      De senaste åren jag arbetat med att nyutveckla ett flertal micro frontends och services för att leverera tjänster med UX-fokus för kunder och konsulter mot vår moln- och on-prem-baserade integrationsplattform.
      Applikationerna har byggts med senaste ASP.NET Core i backend och med Blazor och i vissa fall Next.js/React som frontend.
      Vi deployar vår egen infrastruktur, resurser och uppdateringar på applikationer i Azure enligt DevOps med Docker, Bicep och Azure DevOps.\\\\
      Under tidigare år arbetade jag med underhåll och nyutveckling vårt existerande webbapplikation för att administrera vår plattform för integrationslösningar.
      Nyutvecklingen som gjordes var främst för att supportera flytten av vår plattform till molnet med bl.a. OpenID Connect/OAuth-störekommande.
      Backend är en ASP.NET MVC-applikation som pratar med en Windows-service mot plattformen, medan frontend är en tidig SPA-applikation med Backbone.js som bas.
    highlights:
